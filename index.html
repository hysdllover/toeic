<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEIC voca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151617" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>TOEIC voca</title>
<style>html,body{margin:0;background:#f8f7f4;color:#7b7972;font:300 14px -apple-system,sans-serif}@media(prefers-color-scheme:dark){html,body{background:#151617}}#m{padding:40px 20px;text-align:center}</style>
</head>
<body><div id="m"></div>
<script>
(async()=>{let h=null;
 try{const c=new AbortController();const t=setTimeout(()=>c.abort(),6000);
  const r=await fetch('app.html?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);
  if(r.ok){h=await r.text();try{localStorage.setItem('tv_app',h)}catch(e){}}}catch(e){}
 if(!h){try{h=localStorage.getItem('tv_app')}catch(e){}}
 if(!h){document.getElementById('m').textContent='앱을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.';return}
 document.open();document.write(h);document.close()})();
</script>
</body>
</html>
